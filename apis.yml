aid: sketchpro
name: Sketchpro
description: >-
  SketchPro is an AI copilot for Autodesk Revit that helps architects and
  engineers automate construction documentation directly inside their live
  project models. Delivered as a native Revit plugin (not a public developer
  API), it executes natural-language instructions to handle dimensioning,
  tagging, view creation, sheet setup, and scheduling, while adapting to each
  firm's standards, naming conventions, and documentation logic through an
  admin-configured AI Knowledge Base. Founded in 2023 and used by architecture
  practices including SOM, 10 Design, and Little, SketchPro is backed by Khosla
  Ventures. As of this enrichment pass the company exposes no public API,
  developer portal, OpenAPI specification, SDKs, or event/webhook surface; API
  access is described as "contact vendor / not publicly documented."
